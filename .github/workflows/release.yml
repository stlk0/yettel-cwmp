name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'about.toml'
      - 'about.hbs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'README.txt'
      - 'locales/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect archives without creating a release
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  prepare:
    # Pull request dry runs are free only in a public repository. In a private
    # one they would rebuild all five archives for nearly every change (the
    # paths include CHANGELOG.md and Cargo.toml), so run the dry run by hand.
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version and trigger
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v$version"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DRY_RUN" != true ]]; then
            echo 'workflow_dispatch only supports dry_run=true; a matching tag push creates the draft' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  licenses:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-about@0.9.2
      - name: Generate and verify third party notices
        run: |
          cargo about generate --locked --fail -c about.toml -o THIRD_PARTY_LICENSES.html about.hbs
          python3 packaging/release.py verify-licenses THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [prepare, licenses]
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
            executable: yettel-cwmp
            extension: tar.gz
            python: python3
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            executable: yettel-cwmp
            extension: tar.gz
            python: python3
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            executable: yettel-cwmp.exe
            extension: zip
            python: python
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            executable: yettel-cwmp.exe
            extension: zip
            python: python
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
      - name: Install musl compiler
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build default release executable
        run: |
          rustup show
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
          "./target/$TARGET/release/$EXECUTABLE" --version
          "./target/$TARGET/release/$EXECUTABLE" --help
      - name: Create archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
          PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON" packaging/release.py archive \
            "target/$TARGET/release/$EXECUTABLE" THIRD_PARTY_LICENSES.html \
            "dist/yettel-cwmp-$VERSION-$PLATFORM.$EXTENSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    needs: [prepare, licenses]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
      - name: Build both macOS architectures
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p target/universal/release
          lipo -create \
            target/x86_64-apple-darwin/release/yettel-cwmp \
            target/aarch64-apple-darwin/release/yettel-cwmp \
            -output target/universal/release/yettel-cwmp
          lipo -info target/universal/release/yettel-cwmp
          lipo target/universal/release/yettel-cwmp -verify_arch x86_64 arm64
          target/universal/release/yettel-cwmp --version
          target/universal/release/yettel-cwmp --help
      - name: Create universal archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 packaging/release.py archive \
            target/universal/release/yettel-cwmp THIRD_PARTY_LICENSES.html \
            "dist/yettel-cwmp-$VERSION-macos-universal.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    needs: [prepare, build, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check archives, checksums, and release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 packaging/release.py checksums dist
          python3 packaging/release.py notes "$VERSION" release-notes.txt
          cat dist/SHA256SUMS
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo 'Dry run: five archives, checksums, and release notes verified.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Attestation and draft creation run only on a public, matching tag push.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            dist/*
            release-notes.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: github.event_name == 'push' && !github.event.repository.private
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "yettel-cwmp $VERSION" --notes-file release-notes.txt \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
