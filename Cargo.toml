[package]
name = "yettel-cwmp"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "CWMP client emulating a ZTE CPE to retrieve Yettel PPPoE settings"
repository = "https://github.com/stlk0/yettel-cwmp"
homepage = "https://github.com/stlk0/yettel-cwmp"
readme = "README.md"
keywords = ["cwmp", "tr-069", "router", "pppoe", "terminal"]
categories = ["command-line-utilities", "network-programming"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unreachable = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "warn"
format_push_string = "warn"
too_many_lines = "warn"
needless_pass_by_value = "warn"

[features]
default = []
dev-provider-override = []

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["osc52"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "=0.103.15", default-features = false, features = ["alloc", "ring"] }
md-5 = "0.10.6"
ring = "0.17.14"
httparse = "1"
dirs = "6"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
ctrlc = { version = "3", features = ["termination"] }
lexopt = "0.3.2"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dev-dependencies]
vt100 = "0.16"
libc = "0.2"

[[example]]
name = "fake_acs"
required-features = ["dev-provider-override"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

